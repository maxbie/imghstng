<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Newstoon – die tägliche News als Manga</title>
<meta name="description" content="Jeden Tag eine Meldung von SRF News als Manga-Panel. Mit Archiv aller bisherigen Ausgaben.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><rect x='8' y='8' width='84' height='84' fill='none' stroke='%23FFE600' stroke-width='10'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='monospace' font-weight='900'>N</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Tektur:wght@400;500;600&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #161616;
    --ink: #f2f2f2;
    --muted: #9a9a9a;
    --signal: #ffe600;
    --frame: 4px;
    --shadow: 0px;
    --chrome: 150px;  /* header height plus spacing, used to fit the panel into the viewport */
    --pw: min(1280px, calc(100vw - 32px - var(--shadow)), calc((100dvh - var(--chrome)) * 16 / 9));
    --brand: "Krona One", "Arial Black", sans-serif;
    --kana: "Dela Gothic One", "Hiragino Sans", sans-serif;
    --ui: "Tektur", "Helvetica Neue", Arial, sans-serif;
    --pill: #262626;
    --pill-hover: #363636;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.45;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }

  .wrap { width: var(--pw); margin-inline: auto; }

  /* Header */
  .top { padding: 18px 0 16px; }
  .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark {
    margin: 0;
    font-family: var(--brand);
    font-weight: 400;
    font-size: clamp(1.35rem, 3vw, 1.9rem);
    line-height: 1;
    letter-spacing: 0;
  }
  .kana {
    font-family: var(--kana);
    font-size: .8rem;
    line-height: 1;
    padding: 4px 6px;
    background: var(--signal);
    color: #000;
    white-space: nowrap;
  }
  .credit { color: var(--muted); text-decoration: none; font-size: .9rem; }
  .credit:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  .row2 {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px 20px; flex-wrap: wrap;
    margin-top: 12px;
  }
  .stamp { margin: 0; font-family: var(--ui); font-weight: 500; font-size: clamp(1rem, 2.2vw, 1.25rem); line-height: 1.2; letter-spacing: .01em; }

  .nav { display: flex; align-items: center; gap: 8px; }
  .btn {
    position: relative;
    height: 40px;
    min-width: 40px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: var(--pill);
    color: var(--ink);
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: .02em;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .12s;
  }
  .btn:hover:not(:disabled) { background: var(--pill-hover); }
  .btn:disabled { color: #5a5a5a; cursor: default; }
  .btn.icon { width: 40px; padding: 0; }
  .btn.icon svg { width: 18px; height: 18px; }
  .btn.all { margin-left: 8px; }
  .btn.current[aria-pressed="true"] { color: var(--signal); }
  .btn .dot {
    position: absolute; top: 2px; right: 2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--signal); border: 2px solid var(--bg);
  }

  /* Panel */
  .stage { padding-right: var(--shadow); padding-bottom: calc(var(--shadow) + 16px); }
  .panel {
    position: relative;
    margin: 0;
    aspect-ratio: 16 / 9;
    background: var(--surface);
    overflow: hidden;
    touch-action: pan-y;
  }
  .slide { position: absolute; inset: 0; display: block; box-shadow: 0 0 0 5px var(--bg); }
  .slide img { width: 100%; height: 100%; object-fit: cover; }
  .msg {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 24px; text-align: center;
    font-family: var(--ui); color: var(--muted);
  }

  /* Drawer: side sheet on wide screens, bottom sheet on phones */
  .drawer {
    position: fixed;
    inset: 0 0 0 auto;
    margin: 0;
    width: min(400px, 92vw);
    height: 100dvh;
    max-width: none; max-height: none;
    padding: 0;
    border: 0;
    border-left: 2px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    transform: translateX(0);
    transition: transform .28s ease, overlay .28s allow-discrete, display .28s allow-discrete;
  }
  .drawer:not([open]) { transform: translateX(100%); }
  @starting-style { .drawer[open] { transform: translateX(100%); } }
  .drawer::backdrop { background: rgba(0, 0, 0, .65); }

  .sheet { display: flex; flex-direction: column; height: 100%; }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 2px solid var(--ink);
  }
  .sheet-head h2 { margin: 0; font-family: var(--ui); font-weight: 400; font-size: 1.3rem; }
  .list { overflow-y: auto; padding: 8px 20px 28px; overscroll-behavior: contain; }
  .day h3 {
    margin: 18px 0 10px;
    font-family: var(--ui); font-weight: 400; font-size: .95rem;
    display: inline-block; padding: 0 6px; border: 2px solid var(--ink);
  }
  .entry {
    display: grid; grid-template-columns: 128px 1fr; align-items: center; gap: 14px;
    width: 100%; padding: 6px; margin: 0 0 6px;
    background: none; border: 0; cursor: pointer; text-align: left;
  }
  .entry .thumb { aspect-ratio: 16 / 9; background: var(--surface); overflow: hidden; opacity: .75; transition: opacity .12s; }
  .entry:hover .thumb { opacity: 1; }
  .entry img { width: 100%; height: 100%; object-fit: cover; }
  .entry .time { font-family: var(--ui); font-size: 1rem; }
  .entry { position: relative; }
  .entry[aria-current="true"] { background: var(--pill); }
  .entry[aria-current="true"]::before {
    content: ""; position: absolute; left: -20px; top: 0; bottom: 0;
    width: 4px; background: var(--signal);
  }
  .entry[aria-current="true"] .thumb { opacity: 1; }
  .entry[aria-current="true"] .time { background: var(--signal); color: #000; padding: 0 4px; justify-self: start; }

  @media (max-width: 700px) {
    :root { --chrome: 200px; }
    .row2 { flex-direction: column; align-items: stretch; }
    .nav .btn.current { flex: 1; }
    .drawer {
      inset: auto 0 0 0;
      width: 100%;
      height: auto;
      max-height: 82dvh;
      border-left: 0;
      border-top: 2px solid var(--ink);
    }
    .drawer:not([open]) { transform: translateY(100%); }
    @starting-style { .drawer[open] { transform: translateY(100%); } }
    .sheet { max-height: 82dvh; }
    .sheet-head::before {
      content: ""; position: absolute; left: 50%; top: 7px; transform: translateX(-50%);
      width: 44px; height: 4px; background: var(--muted);
    }
    .sheet-head { position: relative; padding-top: 22px; }
  }

  @media (max-width: 480px) {
    .kana { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .drawer { transition: none; }
  }
</style>
</head>
<body>
  <header class="top wrap">
    <div class="row1">
      <div class="brand">
        <h1 class="wordmark">Newstoon</h1>
        <span class="kana" aria-hidden="true">ニューストゥーン</span>
      </div>
      <a class="credit" href="https://www.instagram.com/improvedlaziness/" target="_blank" rel="noopener">@improvedlaziness</a>
    </div>
    <div class="row2">
      <p class="stamp" id="stamp" aria-live="polite">Lade …</p>
      <nav class="nav" aria-label="Ausgaben">
        <button class="btn icon" id="older" type="button" disabled aria-label="Ältere Ausgabe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="btn current" id="current" type="button" disabled>Aktuell</button>
        <button class="btn icon" id="newer" type="button" disabled aria-label="Neuere Ausgabe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="btn icon all" id="all" type="button" disabled aria-haspopup="dialog" aria-label="Alle Ausgaben" title="Alle Ausgaben">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8.3"/><path d="M3 3.5V8.3h4.8"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="stage wrap">
    <figure class="panel" id="panel">
      <div class="msg" id="msg">Lade die aktuelle Ausgabe …</div>
    </figure>
  </main>

  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="drawer-title">Alle Ausgaben</h2>
        <button class="btn" id="close" type="button">Schliessen</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </dialog>

<script>
(() => {
  const REPO = "maxbie/imghstng";
  const DIR = "newstoon";
  const API = `https://api.github.com/repos/${REPO}/contents/${DIR}?ref=main`;
  const PATTERN = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})(\d{2})\.jpg$/;
  const REFRESH_MS = 10 * 60 * 1000;
  const MIN_GAP_MS = 60 * 1000;
  const SLIDE_MS = 420;

  const $ = (id) => document.getElementById(id);
  const panel = $("panel"), stamp = $("stamp"), list = $("list"), drawer = $("drawer");
  const btnOlder = $("older"), btnNewer = $("newer"), btnCurrent = $("current"), btnAll = $("all");
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const fmtDay = new Intl.DateTimeFormat("de-CH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const fmtDayShort = new Intl.DateTimeFormat("de-CH", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  const fmtTime = new Intl.DateTimeFormat("de-CH", { hour: "2-digit", minute: "2-digit" });
  const fmtDayCompact = new Intl.DateTimeFormat("de-CH", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const narrow = matchMedia("(max-width: 700px)");
  const label = (d) => `${fmtDay.format(d)}, ${fmtTime.format(d)} Uhr`;
  const stampLabel = (d) => narrow.matches ? `${fmtDayCompact.format(d)}, ${fmtTime.format(d)} Uhr` : label(d);

  let items = [];
  let current = -1;
  let etag = null;
  let lastCheck = 0;
  let hasNew = false;
  let token = 0;
  let running = [];

  function showMessage(text) {
    panel.innerHTML = "";
    const div = document.createElement("div");
    div.className = "msg";
    div.textContent = text;
    panel.appendChild(div);
  }

  function makeSlide(item) {
    const a = document.createElement("a");
    a.className = "slide";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.title = "Bild in voller Grösse öffnen";
    const img = document.createElement("img");
    img.src = item.url;
    img.alt = `Newstoon vom ${label(item.date)}`;
    a.appendChild(img);
    return { el: a, img };
  }

  // direction: -1 = going older (new slides in from the left), +1 = going newer (from the right), 0 = no animation
  async function showImage(item, direction) {
    const my = ++token;
    running.forEach((a) => a.finish());
    running = [];

    const { el, img } = makeSlide(item);
    try { await img.decode(); } catch { /* still show it, the browser will render when ready */ }
    if (my !== token) return;

    panel.querySelector(".msg")?.remove();
    const old = panel.querySelector(".slide");
    panel.appendChild(el);

    if (!old || direction === 0 || reduced()) {
      if (old) old.remove();
      return;
    }
    const from = direction < 0 ? "-100%" : "100%";
    const to = direction < 0 ? "100%" : "-100%";
    const opts = { duration: SLIDE_MS, easing: "cubic-bezier(.65,0,.35,1)" };
    const aIn = el.animate([{ transform: `translateX(${from})` }, { transform: "translateX(0)" }], opts);
    const aOut = old.animate([{ transform: "translateX(0)" }, { transform: `translateX(${to})` }], opts);
    running = [aIn, aOut];
    aOut.finished.then(() => old.remove()).catch(() => old.remove());
  }

  function select(index, { updateHash = true, animate = true } = {}) {
    if (!items.length) return;
    const next = Math.max(0, Math.min(index, items.length - 1));
    if (next === current && panel.querySelector(".slide")) return;
    const direction = !animate || current < 0 ? 0 : (next > current ? -1 : 1);
    current = next;
    const item = items[current];

    showImage(item, direction);

    stamp.innerHTML = "";
    const time = document.createElement("time");
    time.dateTime = item.date.toISOString();
    time.textContent = stampLabel(item.date);
    stamp.appendChild(time);

    const isLatest = current === 0;
    if (isLatest) hasNew = false;
    btnNewer.disabled = isLatest;
    btnOlder.disabled = current === items.length - 1;
    btnAll.disabled = false;
    btnCurrent.disabled = false;
    btnCurrent.setAttribute("aria-pressed", isLatest ? "true" : "false");
    btnCurrent.querySelector(".dot")?.remove();
    if (hasNew) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.setAttribute("aria-hidden", "true");
      btnCurrent.appendChild(dot);
      btnCurrent.setAttribute("aria-label", "Aktuell, eine neue Ausgabe ist erschienen");
    } else {
      btnCurrent.removeAttribute("aria-label");
    }

    list.querySelectorAll(".entry").forEach((el) => {
      el.setAttribute("aria-current", Number(el.dataset.index) === current ? "true" : "false");
    });

    if (updateHash) {
      const hash = isLatest ? "" : "#" + item.id;
      history.replaceState(null, "", location.pathname + location.search + hash);
    }
  }

  function renderList() {
    list.innerHTML = "";
    let group = null, lastKey = "";
    items.forEach((item, i) => {
      const key = item.name.slice(0, 10);
      if (key !== lastKey) {
        lastKey = key;
        group = document.createElement("section");
        group.className = "day";
        const h = document.createElement("h3");
        h.textContent = fmtDayShort.format(item.date);
        group.appendChild(h);
        list.appendChild(group);
      }
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "entry";
      btn.dataset.index = i;
      btn.setAttribute("aria-current", i === current ? "true" : "false");
      btn.setAttribute("aria-label", `Ausgabe vom ${label(item.date)} anzeigen`);
      const thumb = document.createElement("span");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = item.url;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      thumb.appendChild(img);
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = fmtTime.format(item.date);
      btn.append(thumb, t);
      btn.addEventListener("click", () => { drawer.close(); select(i); });
      group.appendChild(btn);
    });
  }

  function indexFromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    const i = items.findIndex((it) => it.id === id);
    return i >= 0 ? i : 0;
  }

  function parse(files) {
    return files
      .filter((f) => f.type === "file" && PATTERN.test(f.name))
      .map((f) => {
        const [, y, mo, d, h, mi, s] = f.name.match(PATTERN);
        return {
          id: f.name.replace(/\.jpg$/, ""),
          name: f.name,
          url: f.download_url,
          date: new Date(+y, +mo - 1, +d, +h, +mi, +s)
        };
      })
      .sort((a, b) => b.date - a.date);
  }

  async function load({ initial = false } = {}) {
    lastCheck = Date.now();
    const headers = { Accept: "application/vnd.github+json" };
    if (etag) headers["If-None-Match"] = etag;   // 304 answers don't count against the rate limit

    let res;
    try {
      res = await fetch(API, { headers, cache: "no-store" });
    } catch {
      if (initial) { showMessage("Die Ausgaben konnten nicht geladen werden. Lade die Seite neu."); stamp.textContent = ""; }
      return;
    }
    if (res.status === 304) return;
    if (!res.ok) {
      if (initial) {
        stamp.textContent = "";
        showMessage(res.status === 403 || res.status === 429
          ? "GitHub lässt gerade keine weiteren Abfragen zu. Lade die Seite in einer Stunde neu."
          : "Die Ausgaben konnten nicht geladen werden. Lade die Seite neu.");
      }
      return;
    }
    etag = res.headers.get("ETag") || etag;
    const next = parse(await res.json());

    if (!next.length) {
      if (initial) { stamp.textContent = ""; showMessage("Noch keine Ausgabe vorhanden. Die erste erscheint hier, sobald sie hochgeladen ist."); }
      return;
    }

    if (initial) {
      items = next;
      renderList();
      select(indexFromHash(), { updateHash: false, animate: false });
      return;
    }

    if (items.length && next[0].id === items[0].id && next.length === items.length) return;

    const viewingLatest = current === 0;
    const viewedId = items[current] && items[current].id;
    items = next;
    const keep = items.findIndex((it) => it.id === viewedId);
    current = keep >= 0 ? keep : 0;   // keep the internal position stable before switching
    renderList();

    if (viewingLatest) {
      select(0, { updateHash: false });   // slides the new issue in from the right
    } else {
      hasNew = true;
      const idx = current;
      current = -2;                        // force a refresh of buttons without animating
      select(idx, { updateHash: false, animate: false });
    }
  }

  narrow.addEventListener("change", () => {
    const t = stamp.querySelector("time");
    if (t && items[current]) t.textContent = stampLabel(items[current].date);
  });

  // Controls
  btnOlder.addEventListener("click", () => select(current + 1));
  btnNewer.addEventListener("click", () => select(current - 1));
  btnCurrent.addEventListener("click", () => select(0));
  btnAll.addEventListener("click", () => {
    drawer.showModal();
    const active = list.querySelector('.entry[aria-current="true"]');
    if (active) { active.scrollIntoView({ block: "center" }); active.focus(); }
  });
  $("close").addEventListener("click", () => drawer.close());
  drawer.addEventListener("click", (e) => { if (e.target === drawer) drawer.close(); });

  document.addEventListener("keydown", (e) => {
    if (drawer.open) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); select(current + 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); select(current - 1); }
  });
  window.addEventListener("hashchange", () => select(indexFromHash(), { updateHash: false }));

  // Swipe on the panel: drag right = older (comes in from the left), drag left = newer
  let touchX = null, touchY = null;
  panel.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  panel.addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) select(current + (dx > 0 ? 1 : -1));
  });

  // Auto refresh: every 10 minutes while visible, and when the tab comes back into view
  setInterval(() => { if (document.visibilityState === "visible") load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastCheck > MIN_GAP_MS) load();
  });

  load({ initial: true });
})();
</script>
</body>
</html>
